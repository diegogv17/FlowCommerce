# Actualizaciones automáticas y agrupadas (un PR por grupo, no uno por paquete).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: monthly
    labels: [dependencias, ci]
